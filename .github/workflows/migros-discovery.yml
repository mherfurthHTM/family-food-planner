name: Migros-Produktsuche (nur Recherche)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/discover-migros-products.cjs'
      - '.github/workflows/migros-discovery.yml'

permissions:
  contents: write

jobs:
  find-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts migros-api-wrapper@1.1.37
      - run: node scripts/discover-migros-products.cjs
      - name: Vorschläge speichern (keine ungeprüften Produktzuordnungen)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migros-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Migros-Suchtreffer aktualisieren (nur Recherche)"
            git pull --rebase
            git push
          fi
