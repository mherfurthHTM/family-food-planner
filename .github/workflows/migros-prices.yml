name: Migros-Preise prüfen (inoffiziell)

on:
  workflow_dispatch:
  schedule:
    - cron: '25 5 * * 1,4'
  push:
    branches: [main]
    paths:
      - '.github/workflows/migros-prices.yml'
      - 'scripts/refresh-migros-prices.cjs'

permissions:
  contents: write

concurrency:
  group: migros-price-refresh
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kostenlosen Migros-API-Wrapper installieren
        run: npm install --no-save --no-package-lock --ignore-scripts migros-api-wrapper@1.1.37
      - name: Eindeutig zugeordnete Migros-Webpreise prüfen
        run: node scripts/refresh-migros-prices.cjs
      - name: Verifizierte Daten veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migros-prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Migros-Webpreise aktualisieren (automatisch)"
            git push
          fi
