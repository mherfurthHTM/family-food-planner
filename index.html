function normaliseCustomRecipe(raw,book){
 if(!raw||typeof raw!=='object')throw Error('Ungültiger Rezepteintrag');
 const name=String(raw.name||'').trim();
 if(name.length<2||name.length>140)throw Error('Rezeptname fehlt oder ist zu lang');
 const type=String(raw.type||'');
 if(!orderTypes.includes(type))throw Error(name+': Typ muss breakfast, lunch oder dinner sein');
 const servings=Number(raw.servings||3);
 if(!Number.isInteger(servings)||servings<1||servings>100)throw Error(name+': ungültige Portionenzahl');
 const items=raw.ingredients;
 if(!Array.isArray(items)||items.length===0||items.length>60)throw Error(name+': Zutaten fehlen');
 const ingredients=items.map(i=>{
  const id=String(Array.isArray(i)?i[0]:(i.productId||i.id)||'');
  const q=Number(Array.isArray(i)?i[1]:i.quantity);
  if(!products[id]||!Number.isFinite(q)||q<=0||q>100000)throw Error(name+': Zutat '+id+' ist nicht im Produktkatalog oder Menge ungültig');
  return [id,Math.round(q*3/servings*1000)/1000];
 });
 const steps=Array.isArray(raw.steps)?raw.steps.map(x=>String(x).trim()).filter(Boolean):[];
 if(!steps.length||steps.length>30||steps.some(x=>x.length>1000))throw Error(name+': Zubereitung fehlt oder ist zu lang');
 const source=String(raw.source||book||'Mein Kochbuch').trim().slice(0,90)||'Mein Kochbuch';
 return {id:'user-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10),type,name:name.slice(0,140),emoji:({breakfast:'🥣',lunch:'🍽️',dinner:'🍲'})[type],min:Math.min(300,Math.max(1,Number(raw.minutes||raw.min)||30)),ingredients,steps,tags:['Aus Kochbuch'],protein:Boolean(raw.protein),source,userAdded:true};
}
function downloadJSON(filename,object){
 const url=URL.createObjectURL(new Blob([JSON.stringify(object,null,2)],{type:'application/json'}));
 const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}
async function importBookFile(file){
 if(!file)return;
 if(file.size>2*1024*1024){toast('Bitte eine Rezept-JSON unter 2 MB auswählen');return;}
 try{
  const data=JSON.parse(await file.text()),list=Array.isArray(data)?data:data.recipes;
  if(!Array.isArray(list)||!list.length)throw Error('Die Datei braucht eine recipes-Liste');
  if(list.length>500)throw Error('Maximal 500 Rezepte pro Datei');
  const book=String(Array.isArray(data)?'Meine Rezepte':data.book||'Mein Kochbuch').trim().slice(0,90);
  const parsed=list.map(r=>normaliseCustomRecipe(r,book));
  const existing=new Set(state.userRecipes.map(r=>r.source+'|'+r.name+'|'+r.type));
  const unique=parsed.filter(r=>{const key=r.source+'|'+r.name+'|'+r.type;if(existing.has(key))return false;existing.add(key);return true;});
  if(state.userRecipes.length+unique.length>500)throw Error('Maximal 500 eigene Rezepte; bitte zuerst einige entfernen');
  state.userRecipes.push(...unique);
  for(const r of unique){R.push(r);recipeById[r.id]=r;}
  save();render();toast(unique.length+' neue Rezepte importiert ✓');
 }catch(error){toast('Import fehlgeschlagen: '+String(error.message||error).slice(0,150));}
}
function removeCustomRecipe(id){
 const r=state.userRecipes.find(x=>x.id===id);if(!r)return;
 if(!confirm('Rezept «'+r.name+'» wirklich löschen?'))return;
 state.userRecipes=state.userRecipes.filter(x=>x.id!==id);
 const idx=R.findIndex(x=>x.id===id);if(idx>=0)R.splice(idx,1);
 delete recipeById[id];if(state.plan&&state.plan.some(d=>orderTypes.some(t=>d[t]===id)))generate();else save();
 render();toast('Rezept entfernt');
}

function available(r){let c=state.config;return !(c.noOnion&&r.ingredients.some(([i])=>i==='onion'))&&!(c.noCream&&r.ingredients.some(([i])=>i==='cream'))&&!(c.noSalmon&&r.ingredients.some(([i])=>i==='salmon'))}
function quantities(plan){let result={};if(!plan)return result;for(let day of plan)for(let type of orderTypes){let r=recipeById[day[type]];if(!r)continue;for(let [id,quantity] of r.ingredients)result[id]=(result[id]||0)+quantity*state.config.people/3;}return result}
function pricedProduct(id){
 const base=products[id];if(!base)return null;
 const custom=state.productChoices[id];
 if(!custom||typeof custom!=='object')return {...base,priceOrigin:'estimate'};
 const name=String(custom.name||'').trim(),pack=Number(custom.pack),price=Number(custom.price),url=String(custom.url||'');
 if(!name||name.length>150||!Number.isFinite(pack)||pack<=0||pack>100000||!Number.isFinite(price)||price<0||price>100000||!isMigrosLink(url))return {...base,priceOrigin:'estimate'};
 return {...base,name,pack,price:+price.toFixed(2),productUrl:url,priceOrigin:'manual',updatedAt:custom.updatedAt};
}
function isMigrosLink(link){
 try{const u=new URL(link);return u.protocol==='https:'&&(u.hostname==='migros.ch'||u.hostname==='www.migros.ch')&&u.pathname.startsWith('/de/product/')}
 catch{return false}
}
function basket(plan){let amounts=quantities(plan),rows=[];let total=0;for(let [id,amount] of Object.entries(amounts)){const p=pricedProduct(id);if(!p)continue;if(state.config.pantry&&pantryItems.has(id))continue;const packs=Math.max(1,Math.ceil((amount-1e-8)/p.pack)),cost=+(packs*p.price).toFixed(2);rows.push({...p,amount,packs,cost,key:id});total+=cost}for(let e of state.extras){let price=Number(e.price)||0;rows.push({id:e.id,key:e.id,name:e.name,pack:1,unit:'Stk.',packs:1,amount:1,cost:price,category:'Zusätzlich',extra:true}) ;total+=price}rows.sort((a,b)=>categories.indexOf(a.category)-categories.indexOf(b.category)||a.name.localeCompare(b.name,'de'));return {rows,total:+total.toFixed(2),amounts};}
function recipeTotal(plan,day,type){let r=recipeById[plan[day][type]];let price=0;for(let [id,q] of r.ingredients){if(state.config.pantry&&pantryItems.has(id))continue;let p=pricedProduct(id);price+=p.price*q*state.config.people/(p.pack*3)}return price;}
function randomFrom(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffled(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function improvePlan(original, pools, target){
 let plan=original.map(d=>({...d})), cost=basket(plan).total;
 // Change one recipe at a time, preserving seven different recipes per meal type.
 for(let pass=0;pass<24 && cost>target;pass++){
  let best=null, bestCost=cost;
  for(let i=0;i<7;i++)for(let type of orderTypes){
   const used=new Set(plan.map((d,j)=>j===i?null:d[type]));
   const old=plan[i][type];
   for(let r of pools[type]){
    if(r.id===old||used.has(r.id))continue;
    plan[i][type]=r.id;
    const possible=basket(plan).total;
    if(possible<bestCost-0.009){bestCost=possible;best={i,type,id:r.id}}
   }
   plan[i][type]=old;
  }
  if(!best)break;
  plan[best.i][best.type]=best.id;cost=bestCost;
 }
 return {plan,cost};
}
function generate(){
 let pools={};for(let t of orderTypes){pools[t]=R.filter(r=>r.type===t&&available(r));if(pools[t].length<7)return null}
 const budget=Number(state.config.budget)||180;
 let best=null,bestScore=-Infinity,cheapest=[];
 for(let n=0;n<140;n++){
  let picks={};for(let t of orderTypes){let list=shuffled(pools[t]);if(state.config.highProtein&&n%5!==0){list.sort((a,b)=>Number(b.protein)-Number(a.protein)+(Math.random()-.5)*.9)}
const style=state.config.bookStyle||'mixed';
const targetSource=style==='hearty'?'Deftige Küche':style==='fitness'?'Fitnessküche':'';
const preferred=targetSource?list.filter(r=>r.source===targetSource):state.config.preferCookbooks?list.filter(r=>r.userAdded||r.cookbook):[];
if(preferred.length){
 const preferredRandom=shuffled(preferred),others=shuffled(list.filter(r=>!preferred.includes(r)));
 const maxFromBook=Math.min(targetSource?7:5,preferredRandom.length);
 picks[t]=shuffled([...preferredRandom.slice(0,maxFromBook),...others.slice(0,7-maxFromBook)]);
 if(picks[t].length<7)picks[t].push(...preferredRandom.slice(maxFromBook,maxFromBook+7-picks[t].length));
}else picks[t]=list.slice(0,7);}
  let plan=days.map((_,i)=>Object.fromEntries(orderTypes.map(t=>[t,picks[t][i].id])));
  let cost=basket(plan).total;
  if(cheapest.length<4||cost<cheapest[cheapest.length-1].cost){cheapest.push({plan,cost});cheapest.sort((a,b)=>a.cost-b.cost);cheapest=cheapest.slice(0,4)}
  if(cost<=budget){let target=budget*.89;let protein=plan.flatMap(d=>orderTypes.map(t=>recipeById[d[t]])).filter(r=>r.protein).length;
    let fromBooks=plan.flatMap(d=>orderTypes.map(t=>recipeById[d[t]])).filter(r=>r.userAdded||r.cookbook).length;
     const selectedBook=state.config.bookStyle==='hearty'?'Deftige Küche':state.config.bookStyle==='fitness'?'Fitnessküche':null;
     const selectedMatches=selectedBook?plan.flatMap(d=>orderTypes.map(t=>recipeById[d[t]])).filter(r=>r.source===selectedBook).length:0;
     let score=42-(Math.abs(cost-target)/Math.max(budget,1))*18+protein*.32+(state.config.preferCookbooks?fromBooks*.7:0)+selectedMatches*2+Math.random()*3;
    if(score>bestScore){bestScore=score;best={plan,cost}}}
 }
 // Improve high-cost plans with strategic recipe substitutions, retaining variety.
 if(!best){for(let candidate of cheapest){let improved=improvePlan(candidate.plan,pools,budget*.96);if(!best||improved.cost<best.cost)best=improved;if(improved.cost<=budget*.96)break}}
 // For very tight budgets, allow the warning rather than claiming a false fit.
 let result=best||cheapest[0];state.plan=result.plan;state.checked={};save();return result;
}

const nutrientKeys=['kcal','protein','carbs','fat','fiber'];
function zeroNutrients(){return {kcal:0,protein:0,carbs:0,fat:0,fiber:0}}
function nutrientAdd(total,values){for(const k of nutrientKeys)total[k]+=(Number(values[k])||0);return total}
function nutrientRound(values){let out={};for(const k of nutrientKeys)out[k]=Math.round((Number(values[k])||0)*10)/10;return out}
function recipeNutrients(r,portions=1){
 const result=zeroNutrients(),missing=[];
 if(!r)return {values:result,missing:['Rezept nicht gefunden']};
 for(const [id,quantity] of r.ingredients){
  const profile=nutritionProfiles[id],product=products[id];
  if(!profile||!product){missing.push(id);continue;}
  const factor=quantity/3*portions*(product.unit==='Stk.'?1:0.01);
  for(let i=0;i<nutrientKeys.length;i++)result[nutrientKeys[i]]+=profile[i]*factor;
 }
 return {values:nutrientRound(result),missing};
}

function loggedTotals(date,person=null){const total=zeroNutrients();for(const x of state.nutritionLogs){if(x.date===date&&(person===null||x.person===person))nutrientAdd(total,x.nutrients);}return nutrientRound(total)}
function logMeal(day,person,type,portions){
 if(!Number.isInteger(day)||day<0||day>=7||!Number.isInteger(person)||person<0||person>=state.config.people||!orderTypes.includes(type)||![0.5,1,1.5,2].includes(portions))return false;
 const r=recipeById[state.plan[day][type]],value=recipeNutrients(r,portions);
 if(value.missing.length){toast('Für dieses Rezept fehlen Nährwertangaben');return false}
 const date=nutritionDate(day);
 state.nutritionLogs=state.nutritionLogs.filter(x=>!(x.date===date&&x.person===person&&x.type===type));
 state.nutritionLogs.push({date,person,type,recipeId:r.id,recipeName:r.name,portions,nutrients:value.values});
 if(state.nutritionLogs.length>1000)state.nutritionLogs=state.nutritionLogs.slice(-1000);
 save();render();toast('Mahlzeit für '+personLabel(person)+' eingetragen ✓');return true;
}
function removeMeal(day,person,type){
 const date=nutritionDate(day);
 state.nutritionLogs=state.nutritionLogs.filter(x=>!(x.date===date&&x.person===person&&x.type===type));
 save();render();toast('Eintrag entfernt');
}
function nutrientCards(totals){
 const names=[['kcal','Kalorien','kcal'],['protein','Eiweiss','g'],['carbs','Kohlenhydrate','g'],['fat','Fett','g'],['fiber','Ballaststoffe','g']];
 return '<div class="nutrition-grid">'+names.map(([key,name,unit])=>'<div class="stat"><div><span>'+name+'</span><strong>'+Number(totals[key]).toLocaleString('de-CH',{maximumFractionDigits:1})+' '+unit+'</strong></div></div>').join('')+'</div>';
}
function nutritionPage(){
 state.nutritionPerson=Math.min(Math.max(0,state.nutritionPerson),state.config.people-1);
 state.nutritionDay=Math.max(0,Math.min(6,state.nutritionDay));
 const day=state.nutritionDay,date=nutritionDate(day),person=state.nutritionPerson;
 const current=loggedTotals(date,person),family=loggedTotals(date);
 const members=Array.from({length:state.config.people},(_,i)=>'<option value="'+i+'" '+(i===person?'selected':'')+'>'+esc(personLabel(i))+'</option>').join('');
 const times=days.map((name,i)=>'<button type="button" class="tab '+(i===day?'active':'')+'" data-action="nutrition-day" data-day="'+i+'">'+name.slice(0,2)+' · '+dayString(i)+'</button>').join('');
 const meals=orderTypes.map(type=>{
  const r=recipeById[state.plan[day][type]],n=recipeNutrients(r),entry=nutritionEntry(date,person,type);
  const amount=entry?entry.nutrients:n.values;
  const title=entry?entry.recipeName:r.name;
  const missing=n.missing.length>0;
  const controls=[0.5,1,1.5,2].map(x=>'<button class="btn small '+(entry&&entry.portions===x?'primary':'')+'" type="button" data-action="log-meal" data-day="'+day+'" data-person="'+person+'" data-type="'+type+'" data-portions="'+x+'" '+(missing?'disabled':'')+'>'+x.toLocaleString('de-CH',{maximumFractionDigits:1})+'×</button>').join('');
  return '<section class="form-card" style="margin-bottom:12px"><div class="day-top"><strong>'+esc(typeLabels[type])+'</strong><span class="today-chip">'+(entry?'✓ Gegessen':'Noch nicht erfasst')+'</span></div><h2>'+r.emoji+' '+esc(title)+'</h2><p style="margin:9px 0 14px">'+Math.round(amount.kcal)+' kcal · '+amount.protein.toFixed(1)+' g Eiweiss · '+amount.carbs.toFixed(1)+' g Kohlenhydrate · '+amount.fat.toFixed(1)+' g Fett · '+amount.fiber.toFixed(1)+' g Ballaststoffe</p>'+
   '<div style="font-size:12px;color:#718877;margin-bottom:7px">Wie viele Portionen hast du gegessen? (1× = eine geplante Portion)</div><div class="settings-bottom" style="margin:8px 0;gap:6px">'+controls+(entry?'<button class="btn small" type="button" data-action="remove-meal" data-day="'+day+'" data-person="'+person+'" data-type="'+type+'">↻ Entfernen</button>':'')+'</div>'+
   (entry&&entry.recipeId!==r.id?'<p class="smallprint">Dieser Eintrag gehört zu einem früheren Wochenplan. Die ursprünglich erfassten Nährwerte bleiben erhalten.</p>':'')+(missing?'<p class="smallprint">Für einzelne Zutaten fehlen Nährwertdaten. Erfassen vorübergehend nicht möglich.</p>':'')+'</section>';
 }).join('');
 const recorded=orderTypes.filter(type=>nutritionEntry(date,person,type)).length;
 return '<div class="page-intro"><div><div class="kicker">DEIN ESSEN IM BLICK</div><h1>Ernährungstagebuch 🍽️</h1><p>Nur tatsächlich gegessene Mahlzeiten werden mitgezählt.</p></div></div>'+
  '<section class="form-card"><div class="field" style="max-width:330px"><label for="nutrition-person">Für wen möchtest du die Nährwerte sehen?</label><select id="nutrition-person" data-action="nutrition-person">'+members+'</select></div><div class="tabs" style="overflow-x:auto;flex-wrap:nowrap;padding:4px 0">'+times+'</div></section>'+
  '<div class="section-heading"><h2>Tagesbilanz · '+esc(personLabel(person))+'</h2><span class="subheading">'+recorded+' von 3 Mahlzeiten erfasst</span></div>'+
  nutrientCards(current)+'<div class="section-heading"><h2>Mahlzeiten am '+esc(dayString(day))+'</h2></div>'+meals+
  '<section class="form-card" style="margin-top:16px"><h2>👨‍👩‍👧 Zusammen als Familie</h2><p>Summe aller eingetragenen Personen für diesen Tag, nicht pro Person.</p>'+nutrientCards(family)+'</section>'+
  '<div class="notice info">ℹ️ <div><strong>Alle Nährwerte sind Schätzungen.</strong> Die Werte werden aus Zutatenmengen und einem lokalen Richtwertkatalog berechnet (Rohgewichte und Stück-Schätzungen). Tatsächliche Portionen, Zubereitungsverluste, Marken und andere gegessene Lebensmittel können stark abweichen. Nur eingetragene Mahlzeiten zählen. Keine medizinische Auswertung.</div></div>';
}

function booksPage(){
 const allBooks=[...R.filter(r=>r.cookbook),...state.userRecipes];
 const names=[...new Set(allBooks.map(r=>r.source||'Mein Kochbuch'))].sort((a,b)=>a==='Deftige Küche'?-1:b==='Deftige Küche'?1:a==='Fitnessküche'?-1:b==='Fitnessküche'?1:a.localeCompare(b,'de'));
 const cards=names.map(book=>{
  const items=allBooks.filter(r=>(r.source||'Mein Kochbuch')===book);
  const fixed=items.some(r=>r.cookbook);
  const style=book==='Deftige Küche'?'hearty':book==='Fitnessküche'?'fitness':null;
  const title=fixed?(style==='fitness'?'💪':'🍲'):'📖';
  const detail=style==='fitness'?'Eiweissreiche, alltagstaugliche Gerichte.':style==='hearty'?'Herzhafte Klassiker und sättigende Familiengerichte.':'Deine privat importierten Rezepte.';
  const rows=items.map(r=>{
   const n=recipeNutrients(r).values;
   return '<div class="swap-row"><span class="food-pict">'+r.emoji+'</span><span class="swap-text"><strong>'+esc(r.name)+'</strong><small>'+esc(typeLabels[r.type])+' · '+Number(r.min)+' Min. · ca. '+Math.round(n.kcal)+' kcal / Portion · '+Math.round(n.protein)+' g Eiweiss</small></span><button class="btn small" type="button" data-action="book-recipe" data-id="'+esc(r.id)+'">Rezept</button>'+(r.userAdded?'<button class="btn small" type="button" data-action="remove-recipe" data-id="'+esc(r.id)+'">Entfernen</button>':'')+'</div>';
  }).join('');
  return '<section class="form-card"><div class="day-top"><h2>'+title+' '+esc(book)+'</h2><span class="today-chip">'+items.length+' Rezepte</span></div><p>'+detail+'</p>'+
   (style?'<div class="settings-bottom" style="margin:6px 0 12px"><button class="btn primary small" type="button" data-action="select-book-style" data-style="'+style+'">Diese Küche für die Woche bevorzugen</button></div>':'')+rows+'</section>';
 }).join('');
 return '<div class="page-intro"><div><div class="kicker">DEINE REZEPTSAMMLUNG</div><h1>Meine Kochbücher 📚</h1><p>Zwei kostenlose Kochsammlungen und deine selbst importierten Rezepte.</p></div></div>'+
  cards+
  '<section class="form-card"><h2>Weitere Rezepte importieren</h2><p>Du kannst zusätzlich eigene, vorbereitete Rezeptdateien (JSON) importieren. Persönliche Kochbuchrezepte bleiben lokal auf deinem Gerät und werden nicht öffentlich auf GitHub veröffentlicht.</p>'+
  '<div class="settings-bottom"><label class="btn primary" for="book-file" style="cursor:pointer">＋ Rezeptdatei auswählen</label><input type="file" id="book-file" accept=".json,application/json" aria-label="Rezeptdatei auswählen" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"><button type="button" class="btn" data-action="example-book">⇩ Beispiel-Datei</button><button type="button" class="btn" data-action="export-book">⇩ Eigene Kochbücher sichern</button></div>'+
  '<p class="smallprint">Diese beiden mitgelieferten Sammlungen bestehen aus eigenständig formulierten Rezepten, nicht aus Kopien gekaufter Bücher. PDFs und Kochbuchfotos können aktuell noch nicht direkt eingelesen werden.</p></section>'+
  '<div class="notice info">ℹ️ <div>Alle Mengen und Nährwerte beziehen sich auf geschätzte Werte und werden auf die eingestellte Personenzahl umgerechnet. Die Kochstil-Auswahl bevorzugt passende Rezepte und ergänzt bei Bedarf andere Gerichte, um Abwechslung und Budget zu berücksichtigen.</div></div>';
}

function settingsPage(){let c=state.config;return `<div class="page-intro"><div><div class="kicker">DEIN PLAN. DEINE REGELN.</div><h1>Deine Einstellungen ⚙️</h1><p>Pass die Wochenplanung an deine Familie an.</p></div></div><form id="settings-form"><section class="form-card"><h2>Woche und Budget</h2><p>Bei der Einkaufsliste rechnen wir mit den Mengen für alle Personen und ganzen Packungen.</p><div class="form-grid"><div class="field"><label for="budget">Wochenbudget (CHF)</label><input id="budget" name="budget" type="number" min="0.05" max="1000000" step="0.05" value="${c.budget}" required></div><div class="field"><label for="people">Personen</label><input id="people" name="people" type="number" min="1" max="100" step="1" value="${c.people}" required></div><div class="field"><label for="book-style">Kochstil</label><select id="book-style" name="bookStyle"><option value="mixed" ${(c.bookStyle||'mixed')==='mixed'?'selected':''}>Gemischt</option><option value="hearty" ${c.bookStyle==='hearty'?'selected':''}>Deftige Küche</option><option value="fitness" ${c.bookStyle==='fitness'?'selected':''}>Fitnessküche</option></select></div><div class="field"><label for="start">Wochenbeginn</label><input id="start" name="start" type="date" value="${esc(c.start)}" required></div></div><div class="field" style="max-width:620px;margin-top:15px"><label for="member-names">Namen für Ernährungstagebuch (optional, mit Kommas trennen)</label><input id="member-names" name="memberNames" maxlength="300" value="${esc(c.memberNames||'')}" placeholder="z. B. Person A, Person B, Kind"></div></section><section class="form-card"><h2>Ernährungswünsche</h2><p>Nur wenn du möchtest: Einzelne Zutaten ausschliessen oder Gerichte bevorzugen. Keine spezielle Ernährungsform vorgegeben.</p><div class="checks"><label class="check-item"><input type="checkbox" name="noOnion" ${c.noOnion?'checked':''}> Keine Zwiebeln</label><label class="check-item"><input type="checkbox" name="noCream" ${c.noCream?'checked':''}> Kein Rahm</label><label class="check-item"><input type="checkbox" name="noSalmon" ${c.noSalmon?'checked':''}> Kein Lachs</label><label class="check-item"><input type="checkbox" name="highProtein" ${c.highProtein?'checked':''}> Eiweissreiche Gerichte bevorzugen</label><label class="check-item"><input type="checkbox" name="preferCookbooks" ${c.preferCookbooks?'checked':''}> Kochbuchrezepte bei gemischter Planung bevorzugen</label><label class="check-item"><input type="checkbox" name="pantry" ${c.pantry?'checked':''}> Grundvorrat bereits vorhanden (Öl, Gewürze usw.)</label></div></section><div class="settings-bottom"><button class="btn primary" type="submit">✓ Speichern und neu planen</button><button class="btn" type="button" data-action="export">⇩ Daten exportieren</button><button class="btn" type="button" data-action="reset">↻ Alles zurücksetzen</button></div></form><div class="notice info">🔒 <div>Alle Einstellungen, Mahlzeiten und Häkchen werden nur lokal auf diesem Gerät gespeichert. Keine Anmeldung, kein Tracking, kein Zugriff auf dein Migros-Konto.</div></div>`}
function render(){syncNav();main.innerHTML=state.view==='plan'?planPage():state.view==='list'?listPage():state.view==='books'?booksPage():state.view==='nutrition'?nutritionPage():settingsPage();}
function textList(){let b=basket(state.plan);let str=`FAMILY FOOD PLANNER – MIGROS\n${dateHeader()} · ${state.config.people} Personen · Budget ${money(state.config.budget)}\nGeschätzter Einkauf: ${money(b.total)}\n\n`;for(let cat of categories){let rows=b.rows.filter(x=>x.category===cat);if(!rows.length)continue;str+=`${cat.toUpperCase()}\n`;for(let r of rows)str+=`${state.checked[r.key]?'[x]':'[ ]'} ${r.name}: ${r.extra?'1 Stk.':`${r.packs} × ${formatAmount(r.pack,r.unit)}`} – ${money(r.cost)}\n`;str+='\n'}return str+'Preise sind Richtwerte; aktuelle Preise und Filialsortiment prüfen.'}
function toast(message){let t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3000)}
async function copyList(){let text=textList();try{await navigator.clipboard.writeText(text);toast('Einkaufsliste kopiert ✓')}catch{let el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();try{document.execCommand('copy');toast('Einkaufsliste kopiert ✓')}catch{toast('Kopieren hier leider nicht möglich')}el.remove()}}
function bookRecipeDialog(id){
 const r=recipeById[id];if(!r)return;
 const n=recipeNutrients(r).values;
 const sum=r.ingredients.map(([pid,q])=>'<li><strong>'+esc(products[pid].name)+'</strong><span>'+formatAmount(q*state.config.people/3,products[pid].unit)+'</span></li>').join('');
 const steps=r.steps.map(step=>'<li>'+esc(step)+'</li>').join('');
 modalRoot.innerHTML='<div class="modal-backdrop" data-action="close-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">'+
 '<div class="modal-head"><button class="close-btn" data-action="close" aria-label="Schliessen">×</button><div class="food-illustration">'+r.emoji+'</div><div class="kicker">'+esc(r.source||'Rezept')+' · '+esc(typeLabels[r.type])+'</div><h2 id="modal-title">'+esc(r.name)+'</h2><p>⏱ '+r.min+' Minuten · Zutaten für '+state.config.people+' Personen</p></div>'+
 '<div class="modal-body"><div class="pill-list"><span class="pill">ca. '+Math.round(n.kcal)+' kcal pro Person</span><span class="pill">'+n.protein.toFixed(1)+' g Eiweiss</span><span class="pill">'+n.carbs.toFixed(1)+' g Kohlenhydrate</span><span class="pill">'+n.fat.toFixed(1)+' g Fett</span></div>'+
 '<h3>Zutaten</h3><ul class="ingredient-list">'+sum+'</ul><h3>Zubereitung</h3><ol class="steps">'+steps+'</ol><p class="smallprint">Nährwerte sind grobe Richtwerte auf Basis typischer Zutaten, keine verifizierten Migros-Produktdaten.</p>'+
 '<div class="modal-actions"><button class="btn primary" data-action="close">Fertig</button></div></div></div></div>';
}

function recipeDialog(day,type){let r=recipeById[state.plan[day][type]];const sum=r.ingredients.map(([id,q])=>`<li><strong>${esc(products[id].name)}</strong><span>${formatAmount(q*state.config.people/3,products[id].unit)}</span></li>`).join('');modalRoot.innerHTML=`<div class="modal-backdrop" data-action="close-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><button class="close-btn" aria-label="Schliessen" data-action="close">×</button><div class="food-illustration">${r.emoji}</div><div class="kicker">${esc(days[day])} · ${typeLabels[type]}</div><h2 id="modal-title">${esc(r.name)}</h2><p>⏱ ${r.min} Minuten · Für ${state.config.people} ${state.config.people===1?'Person':'Personen'}${r.userAdded?' · '+esc(r.source):''}</p></div><div class="modal-body"><div class="pill-list">${r.tags.map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div><h3>Zutaten</h3><ul class="ingredient-list">${sum}</ul><h3>Zubereitung</h3><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="modal-actions"><button class="btn primary" data-action="swap" data-day="${day}" data-type="${type}">⇄ Gericht austauschen</button><button class="btn" data-action="close">Fertig</button></div></div></div></div>`}
function swapDialog(day,type){let current=state.plan[day][type];let rCurrent=recipeById[current];const candidates=R.filter(r=>r.type===type&&available(r)&&r.id!==current);let prev=basket(state.plan).total;let options=candidates.map(r=>{let copy=state.plan.map(x=>({...x}));copy[day][type]=r.id;return {r,total:basket(copy).total}}).sort((a,b)=>Number(Boolean(b.r.userAdded||b.r.cookbook))-Number(Boolean(a.r.userAdded||a.r.cookbook))||a.total-b.total).slice(0,16);
modalRoot.innerHTML=`<div class="modal-backdrop" data-action="close-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><button class="close-btn" aria-label="Schliessen" data-action="close">×</button><div class="kicker">${days[day]} · ${typeLabels[type]}</div><h2 id="modal-title">Gericht austauschen</h2><p>Aktuell: ${esc(rCurrent.name)} · Geschätzter Einkauf: ${money(prev)}</p></div><div class="modal-body"><p class="smallprint">Der Betrag zeigt, was der gesamte Wocheneinkauf nach dem Austausch ungefähr kostet.</p>${options.map(({r,total})=>`<div class="swap-row"><span class="food-pict">${r.emoji}</span><span class="swap-text"><strong>${esc(r.name)}</strong><small>${r.min} Min. · ${money(total)} gesamt ${total<=state.config.budget?'✓ im Budget':'⚠ über Budget'}</small></span><button class="btn small ${total<=state.config.budget?'primary':''}" data-action="choose" data-day="${day}" data-type="${type}" data-id="${r.id}">Wählen</button></div>`).join('')}<div class="modal-actions"><button class="btn" data-action="recipe" data-day="${day}" data-type="${type}">‹ Zurück</button></div></div></div></div>`}
function closeModal(){modalRoot.innerHTML=''}
function switchView(view){state.view=view;state.filter='Alle';closeModal();render();window.scrollTo({top:0,behavior:'smooth'});}
function exportData(){const data=JSON.stringify({version:1,exportedAt:new Date().toISOString(),...state,view:undefined,filter:undefined},null,2);const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));link.download='family-food-planner-daten.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);toast('Daten exportiert')}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action], [data-view]');if(!el)return;if(el.dataset.view){switchView(el.dataset.view);return}const a=el.dataset.action;
 if(a==='close-backdrop'){if(e.target===el)closeModal();return}if(a==='close'){closeModal();return}
 if(a==='regenerate'){generate();render();toast('Neuer Menüplan erstellt ✓')}
  if(a==='nutrition-day'){const d=Number(el.dataset.day);if(Number.isInteger(d)&&d>=0&&d<7){state.nutritionDay=d;render()}return}
  if(a==='log-meal'){logMeal(Number(el.dataset.day),Number(el.dataset.person),el.dataset.type,Number(el.dataset.portions));return}
  if(a==='remove-meal'){removeMeal(Number(el.dataset.day),Number(el.dataset.person),el.dataset.type);return}
  if(a==='export-book')exportCookbook();if(a==='example-book')exportExample();if(a==='remove-recipe')removeCustomRecipe(el.dataset.id);
  if(a==='book-recipe'){bookRecipeDialog(el.dataset.id);return}
  if(a==='select-book-style'){const style=el.dataset.style;if(style==='hearty'||style==='fitness'){state.config.bookStyle=style;generate();switchView('plan');toast('Kochstil aktiviert ✓')}return}
 if(a==='recipe')recipeDialog(Number(el.dataset.day),el.dataset.type);
 if(a==='swap')swapDialog(Number(el.dataset.day),el.dataset.type);
 if(a==='choose'){state.plan[Number(el.dataset.day)][el.dataset.type]=el.dataset.id;save();closeModal();render();toast('Gericht & Einkaufsliste aktualisiert ✓')}
 if(a==='copy')copyList();if(a==='print')window.print();
 if(a==='filter'){state.filter=el.dataset.filter;render()}
 if(a==='reset-checks'){state.checked={};save();render();toast('Alle Häkchen zurückgesetzt')}
 if(a==='remove-extra'){e.preventDefault();state.extras=state.extras.filter(x=>x.id!==el.dataset.id);delete state.checked[el.dataset.id];save();render();toast('Produkt entfernt')}
 if(a==='export')exportData();if(a==='reset'){if(confirm('Alle Einstellungen, Pläne und Häkchen wirklich zurücksetzen?')){localStorage.removeItem('ffp-migros-v1');location.reload()}}
});
document.addEventListener('change',e=>{if(e.target.dataset.action==='nutrition-person'){const p=Number(e.target.value);if(Number.isInteger(p)&&p>=0&&p<state.config.people){state.nutritionPerson=p;render()}return}if(e.target.id==='book-file'){const selected=e.target.files&&e.target.files[0];if(selected)importBookFile(selected);e.target.value='';return}if(e.target.dataset.action==='check'){state.checked[e.target.dataset.key]=e.target.checked;save();render()}});
document.addEventListener('submit',e=>{if(e.target.id==='quick-settings-form'){e.preventDefault();const f=new FormData(e.target),budget=Number(f.get('budget')),people=Number(f.get('people'));if(!Number.isFinite(budget)||budget<0.05||budget>1000000||!Number.isInteger(people)||people<1||people>100){toast('Bitte gültiges Budget und Personenzahl eingeben');return;}state.config.budget=budget;state.config.people=people;state.config.bookStyle=['mixed','hearty','fitness'].includes(f.get('bookStyle'))?f.get('bookStyle'):'mixed';generate();render();toast('Wochenplan mit neuem Kochstil erstellt ✓');return;}
if(e.target.id==='extra-form'){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim(),price=Number(f.get('price'));if(!name||!Number.isFinite(price)||price<0)return;state.extras.push({id:'extra-'+Date.now()+'-'+Math.floor(Math.random()*1e6),name,price:+price.toFixed(2)});save();render();toast('Produkt hinzugefügt ✓')}
 if(e.target.id==='settings-form'){e.preventDefault();let f=new FormData(e.target),budget=Number(f.get('budget')),people=Number(f.get('people')),start=String(f.get('start')||'');if(!Number.isFinite(budget)||budget<0.05||budget>1000000||!Number.isInteger(people)||people<1||people>100||!/^\d{4}-\d\d-\d\d$/.test(start)){toast('Bitte gültige Werte eingeben');return}state.config={budget,people,start,noOnion:f.has('noOnion'),noCream:f.has('noCream'),noSalmon:f.has('noSalmon'),highProtein:f.has('highProtein'),pantry:f.has('pantry'),preferCookbooks:f.has('preferCookbooks'),bookStyle:['mixed','hearty','fitness'].includes(f.get('bookStyle'))?f.get('bookStyle'):'mixed',memberNames:String(f.get('memberNames')||'').slice(0,300)};generate();switchView('plan');toast('Einstellungen gespeichert & neu geplant ✓')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.FamilyFoodPlanner={products,recipes:R,getState:()=>JSON.parse(JSON.stringify(state)),calculate:basket,generate,recipeNutrients,loggedTotals,logMeal,removeMeal};
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
