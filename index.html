const recipeById=Object.fromEntries(R.map(r=>[r.id,r]));
const days=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const typeLabels={breakfast:'Frühstück',lunch:'Mittagessen',dinner:'Abendessen'};
const orderTypes=['breakfast','lunch','dinner'];
const categories=['Früchte & Gemüse','Brot & Backwaren','Milchprodukte','Fleisch & Fisch','Pasta & Reis','Konserven & Saucen','Tiefkühlprodukte','Frühstück','Grundvorrat','Zusätzlich'];
const fmt=(v)=>Number(v).toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=(v)=>'CHF '+fmt(v);
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toDate=(s)=>{let d=new Date(s+'T12:00:00');return Number.isNaN(d.getTime())?new Date():d};
const iso=(d)=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
function nextMonday(){let d=new Date();d.setHours(12,0,0,0);const delta=((8-d.getDay())%7)||7;d.setDate(d.getDate()+delta);return iso(d)}
function load(){try{let x=JSON.parse(localStorage.getItem('ffp-migros-v1')||'null');return x&&typeof x==='object'?x:null}catch{return null}}
let saved=load();
let storedConfig={...(saved?.config||{})};
// Früher automatisch gesetzte Ernährungsfilter werden bei der Migration neutralisiert.
if(!saved?.appVersion){storedConfig.noOnion=false;storedConfig.noCream=false;storedConfig.noSalmon=false;storedConfig.highProtein=false;}
let state={config:{budget:180,people:3,start:nextMonday(),noOnion:false,noCream:false,noSalmon:false,highProtein:false,pantry:false,preferCookbooks:true,...storedConfig},plan:saved?.plan||null,checked:saved?.checked||{},extras:saved?.extras||[],userRecipes:[],view:'plan',filter:'Alle'};
function save(){try{localStorage.setItem('ffp-migros-v1',JSON.stringify({appVersion:2,config:state.config,plan:state.plan,checked:state.checked,extras:state.extras,userRecipes:state.userRecipes}))}catch{console.warn('Lokaler Speicher nicht verfügbar')}}
function available(r){let c=state.config;return !(c.noOnion&&r.ingredients.some(([i])=>i==='onion'))&&!(c.noCream&&r.ingredients.some(([i])=>i==='cream'))&&!(c.noSalmon&&r.ingredients.some(([i])=>i==='salmon'))}
function quantities(plan){let result={};if(!plan)return result;for(let day of plan)for(let type of orderTypes){let r=recipeById[day[type]];if(!r)continue;for(let [id,quantity] of r.ingredients)result[id]=(result[id]||0)+quantity*state.config.people/3;}return result}
function basket(plan){let amounts=quantities(plan),rows=[];let total=0;for(let [id,amount] of Object.entries(amounts)){const p=products[id];if(!p)continue;if(state.config.pantry&&pantryItems.has(id))continue;const packs=Math.max(1,Math.ceil((amount-1e-8)/p.pack)),cost=+(packs*p.price).toFixed(2);rows.push({...p,amount,packs,cost,key:id});total+=cost}for(let e of state.extras){let price=Number(e.price)||0;rows.push({id:e.id,key:e.id,name:e.name,pack:1,unit:'Stk.',packs:1,amount:1,cost:price,category:'Zusätzlich',extra:true}) ;total+=price}rows.sort((a,b)=>categories.indexOf(a.category)-categories.indexOf(b.category)||a.name.localeCompare(b.name,'de'));return {rows,total:+total.toFixed(2),amounts};}
function recipeTotal(plan,day,type){let r=recipeById[plan[day][type]];let price=0;for(let [id,q] of r.ingredients){if(state.config.pantry&&pantryItems.has(id))continue;let p=products[id];price+=p.price*q*state.config.people/(p.pack*3)}return price;}
function randomFrom(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffled(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function improvePlan(original, pools, target){
 let plan=original.map(d=>({...d})), cost=basket(plan).total;
 // Change one recipe at a time, preserving seven different recipes per meal type.
 for(let pass=0;pass<24 && cost>target;pass++){
  let best=null, bestCost=cost;
  for(let i=0;i<7;i++)for(let type of orderTypes){
   const used=new Set(plan.map((d,j)=>j===i?null:d[type]));
   const old=plan[i][type];
   for(let r of pools[type]){
    if(r.id===old||used.has(r.id))continue;
    plan[i][type]=r.id;
    const possible=basket(plan).total;
    if(possible<bestCost-0.009){bestCost=possible;best={i,type,id:r.id}}
   }
   plan[i][type]=old;
  }
  if(!best)break;
  plan[best.i][best.type]=best.id;cost=bestCost;
 }
 return {plan,cost};
}
function generate(){
 let pools={};for(let t of orderTypes){pools[t]=R.filter(r=>r.type===t&&available(r));if(pools[t].length<7)return null}
 const budget=Number(state.config.budget)||180;
 let best=null,bestScore=-Infinity,cheapest=[];
 for(let n=0;n<140;n++){
  let picks={};for(let t of orderTypes){let list=shuffled(pools[t]);if(state.config.highProtein&&n%5!==0){list.sort((a,b)=>Number(b.protein)-Number(a.protein)+(Math.random()-.5)*.9)}picks[t]=list.slice(0,7)}
  let plan=days.map((_,i)=>Object.fromEntries(orderTypes.map(t=>[t,picks[t][i].id])));
  let cost=basket(plan).total;
  if(cheapest.length<4||cost<cheapest[cheapest.length-1].cost){cheapest.push({plan,cost});cheapest.sort((a,b)=>a.cost-b.cost);cheapest=cheapest.slice(0,4)}
  if(cost<=budget){let target=budget*.89;let protein=plan.flatMap(d=>orderTypes.map(t=>recipeById[d[t]])).filter(r=>r.protein).length;
    let score=42-(Math.abs(cost-target)/Math.max(budget,1))*18+protein*.32+Math.random()*3;
    if(score>bestScore){bestScore=score;best={plan,cost}}}
 }
 // Improve high-cost plans with strategic recipe substitutions, retaining variety.
 if(!best){for(let candidate of cheapest){let improved=improvePlan(candidate.plan,pools,budget*.96);if(!best||improved.cost<best.cost)best=improved;if(improved.cost<=budget*.96)break}}
 // For very tight budgets, allow the warning rather than claiming a false fit.
 let result=best||cheapest[0];state.plan=result.plan;state.checked={};save();return result;
}

if(!state.plan||state.plan.length!==7||state.plan.some(d=>orderTypes.some(t=>!recipeById[d[t]])))generate();
let main=document.getElementById('main');const modalRoot=document.getElementById('modal-root');
function dateFor(i){let d=toDate(state.config.start);d.setDate(d.getDate()+i);return d}
function dayString(i){return dateFor(i).toLocaleDateString('de-CH',{day:'numeric',month:'short'})}
function dateHeader(){let first=dayString(0),last=dayString(6);return `${first} – ${last}`}
function syncNav(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));document.getElementById('week-range').textContent=dateHeader();let count=basket(state.plan).rows.length;document.getElementById('nav-list-count').textContent=count}
function planPage(){let b=basket(state.plan);let budget=Number(state.config.budget),left=budget-b.total,percent=Math.min(100,b.total/Math.max(1,budget)*100),over=left<0;
 return `<div class="page-intro"><div><div class="kicker">Deine Woche, clever geplant</div><h1>Was essen wir diese Woche?</h1><p>Leckeres Essen für ${state.config.people} ${state.config.people===1?'Person':'Personen'} – alles bei der Migros.</p></div><button class="btn" data-action="regenerate">⟳ <span>Neu planen</span></button></div>
 <section class="hero"><div><div class="hero-eyebrow">GEPLANTER WOCHENEINKAUF</div><div class="hero-price">${fmt(b.total)} <small>von ${fmt(budget)} CHF</small></div><div class="hero-sub">Richtpreise inklusive ganzer Packungen · ${state.config.people} Personen · 7 Tage</div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${budget}" aria-valuenow="${b.total}"><div class="progress-inner ${over?'over':''}" style="width:${percent}%"></div></div><div class="hero-progress-info"><span>${over?'Budget überschritten':'Eingeplant'}</span><strong>${over?fmt(-left)+' CHF über Budget':fmt(left)+' CHF übrig'}</strong></div></div><div class="hero-right"><div class="plate"><span class="dish">🥗</span></div></div></section>
 <form id="quick-settings-form" class="form-card" style="margin-top:16px;margin-bottom:0;padding:17px"><div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));align-items:end"><div class="field"><label for="quick-budget">Dein Budget (CHF)</label><input id="quick-budget" name="budget" type="number" min="0.05" max="1000000" step="0.05" value="${state.config.budget}" required></div><div class="field"><label for="quick-people">Wie viele Personen?</label><input id="quick-people" name="people" type="number" min="1" max="100" step="1" value="${state.config.people}" required></div><button class="btn primary" type="submit" style="min-height:48px">✓ Neu berechnen</button></div></form>
  <div class="stat-grid"><div class="stat"><div class="stat-icon">🍽️</div><div><span>Mahlzeiten</span><strong>21 geplant</strong></div></div><div class="stat"><div class="stat-icon">👨‍👩‍👧</div><div><span>Pro Person / Tag</span><strong>${money(b.total/(state.config.people*7))}</strong></div></div><div class="stat"><div class="stat-icon">🛒</div><div><span>Einkaufspositionen</span><strong>${b.rows.length} Produkte</strong></div></div></div>
 ${over?`<div class="notice danger">⚠️ <div><strong>Das Budget ist um ${money(-left)} überschritten.</strong><br>Probiere «Neu planen» oder erhöhe das Budget in den Einstellungen.</div></div>`:''}
 <div class="section-heading"><h2>Dein 7-Tage-Menüplan</h2><button class="btn small soft" data-view="list">☷ Einkaufsliste ansehen</button></div>
 <div class="day-grid">${state.plan.map((day,i)=>`<article class="day-card"><div class="day-top"><div><span class="day-heading">${days[i]}</span><span class="day-date">${dayString(i)}</span></div><span class="today-chip">Tag ${i+1}</span></div>${orderTypes.map((t,index)=>{let r=recipeById[day[t]];return `<button class="meal" data-action="recipe" data-day="${i}" data-type="${t}"><span class="meal-emoji">${r.emoji}</span><span class="meal-content"><span>${typeLabels[t]}</span><strong>${esc(r.name)}</strong></span><span class="meal-chevron">›</span></button>`}).join('')}<div class="day-footer"><span>☷ 3 Mahlzeiten</span><strong>ca. ${money(orderTypes.reduce((sum,t)=>sum+recipeTotal(state.plan,i,t),0))} Zutatenwert</strong></div></article>`).join('')}</div>
 <div class="notice info">ℹ️ <div>Die App plant mit einem lokalen Richtpreis-Katalog. Der Betrag ist eine <strong>Schätzung</strong>, kein verbindlicher Migros-Kassenpreis. Aktionen und Filialsortiment können abweichen.</div></div>`;
}
function formatAmount(q,unit){let v=Math.round(q*10)/10;return `${Number.isInteger(v)?v:v.toLocaleString('de-CH',{maximumFractionDigits:1})} ${unit}`}
function listPage(){let b=basket(state.plan),done=b.rows.filter(p=>state.checked[p.key]).length,filter=state.filter;let shown=b.rows.filter(r=>filter==='Alle'||r.category===filter);let cats=[...new Set(shown.map(r=>r.category))];return `<div class="page-intro"><div><div class="kicker">ALLES AUF EINER LISTE</div><h1>Dein Migros-Einkauf 🛒</h1><p>${done} von ${b.rows.length} Positionen abgehakt · Packungsgrössen berücksichtigt</p></div><button class="btn" data-action="copy">⧉ Liste kopieren</button></div>
 <div class="stat-grid"><div class="stat"><div class="stat-icon">💳</div><div><span>Gesamt geschätzt</span><strong>${money(b.total)}</strong></div></div><div class="stat"><div class="stat-icon">✅</div><div><span>Bereits im Wagen</span><strong>${done} / ${b.rows.length}</strong></div></div><div class="stat"><div class="stat-icon">💚</div><div><span>Budgetrest</span><strong class="${b.total>state.config.budget?'budget-over':'budget-ok'}">${money(state.config.budget-b.total)}</strong></div></div></div>
 <div class="tabs">${['Alle',...categories.filter(c=>b.rows.some(r=>r.category===c))].map(c=>`<button class="tab ${filter===c?'active':''}" data-action="filter" data-filter="${esc(c)}">${esc(c)}</button>`).join('')}</div>
 <div class="shopping-panel"><div>${cats.map(c=>`<section class="category"><h3>${esc(c)}<small>${shown.filter(r=>r.category===c).length} Produkte</small></h3>${shown.filter(r=>r.category===c).map(p=>`<label class="product-row ${state.checked[p.key]?'checked':''}"><input type="checkbox" data-action="check" data-key="${esc(p.key)}" ${state.checked[p.key]?'checked':''}><span><span class="product-name">${esc(p.name)}</span><span class="product-meta">${p.extra?'Manuell hinzugefügt':`${p.packs} × ${formatAmount(p.pack,p.unit)} · Bedarf ${formatAmount(p.amount,p.unit)}`}</span></span><span class="product-price">${money(p.cost)}${p.extra?`<button class="remove-btn" type="button" data-action="remove-extra" data-id="${esc(p.id)}">Entfernen</button>`:'<small>Richtpreis</small>'}</span></label>`).join('')}</section>`).join('')||`<div class="empty">Keine Produkte in dieser Kategorie.</div>`}
 <section class="form-card"><h2>Etwas hinzufügen?</h2><p>Weitere Einkäufe fliessen in die Budgetrechnung ein.</p><form class="extra-form" id="extra-form"><label class="sr-only" for="extra-name">Produkt</label><input id="extra-name" name="name" placeholder="z. B. Mineralwasser" maxlength="60" required><label class="sr-only" for="extra-price">Preis CHF</label><input id="extra-price" name="price" placeholder="CHF" type="number" min="0" max="1000" step="0.05" required><button class="btn primary" type="submit">+ Hinzufügen</button></form></section></div>
 <aside class="summary-card"><h3>Dein Einkaufsbudget</h3><div class="summary-line"><span>Produkte</span><strong>${b.rows.length}</strong></div><div class="summary-line"><span>Bereits abgehakt</span><strong>${done}</strong></div><div class="summary-line"><span>Verfügbares Budget</span><strong>${money(state.config.budget)}</strong></div><div class="summary-divider"></div><div class="summary-total"><span>Geschätzter Betrag</span><strong>${money(b.total)}</strong></div><div class="summary-line"><span>${b.total>state.config.budget?'Budgetüberschreitung':'Verbleibend'}</span><strong class="${b.total>state.config.budget?'budget-over':'budget-ok'}">${money(Math.abs(state.config.budget-b.total))}</strong></div><div class="summary-divider"></div><button class="btn primary wide" data-action="copy">⧉ Einkaufsliste kopieren</button><button class="btn wide" data-action="print">⇩ Drucken / PDF</button><button class="btn wide" data-action="reset-checks">↻ Häkchen zurücksetzen</button><p class="smallprint">Die Preise sind Schätzwerte. Bitte vor dem Einkauf mit den Migros-Angeboten vergleichen. Nicht automatisch an Migros übertragbar.</p></aside></div>`}
function settingsPage(){let c=state.config;return `<div class="page-intro"><div><div class="kicker">DEIN PLAN. DEINE REGELN.</div><h1>Deine Einstellungen ⚙️</h1><p>Pass die Wochenplanung an deine Familie an.</p></div></div><form id="settings-form"><section class="form-card"><h2>Woche und Budget</h2><p>Bei der Einkaufsliste rechnen wir mit den Mengen für alle Personen und ganzen Packungen.</p><div class="form-grid"><div class="field"><label for="budget">Wochenbudget (CHF)</label><input id="budget" name="budget" type="number" min="0.05" max="1000000" step="0.05" value="${c.budget}" required></div><div class="field"><label for="people">Personen</label><input id="people" name="people" type="number" min="1" max="100" step="1" value="${c.people}" required></div><div class="field"><label for="start">Wochenbeginn</label><input id="start" name="start" type="date" value="${esc(c.start)}" required></div></div></section><section class="form-card"><h2>Ernährungswünsche</h2><p>Nur wenn du möchtest: Einzelne Zutaten ausschliessen oder Gerichte bevorzugen. Keine spezielle Ernährungsform vorgegeben.</p><div class="checks"><label class="check-item"><input type="checkbox" name="noOnion" ${c.noOnion?'checked':''}> Keine Zwiebeln</label><label class="check-item"><input type="checkbox" name="noCream" ${c.noCream?'checked':''}> Kein Rahm</label><label class="check-item"><input type="checkbox" name="noSalmon" ${c.noSalmon?'checked':''}> Kein Lachs</label><label class="check-item"><input type="checkbox" name="highProtein" ${c.highProtein?'checked':''}> Eiweissreiche Gerichte bevorzugen</label><label class="check-item"><input type="checkbox" name="pantry" ${c.pantry?'checked':''}> Grundvorrat bereits vorhanden (Öl, Gewürze usw.)</label></div></section><div class="settings-bottom"><button class="btn primary" type="submit">✓ Speichern und neu planen</button><button class="btn" type="button" data-action="export">⇩ Daten exportieren</button><button class="btn" type="button" data-action="reset">↻ Alles zurücksetzen</button></div></form><div class="notice info">🔒 <div>Alle Einstellungen, Mahlzeiten und Häkchen werden nur lokal auf diesem Gerät gespeichert. Keine Anmeldung, kein Tracking, kein Zugriff auf dein Migros-Konto.</div></div>`}
function render(){syncNav();main.innerHTML=state.view==='plan'?planPage():state.view==='list'?listPage():settingsPage();}
function textList(){let b=basket(state.plan);let str=`FAMILY FOOD PLANNER – MIGROS\n${dateHeader()} · ${state.config.people} Personen · Budget ${money(state.config.budget)}\nGeschätzter Einkauf: ${money(b.total)}\n\n`;for(let cat of categories){let rows=b.rows.filter(x=>x.category===cat);if(!rows.length)continue;str+=`${cat.toUpperCase()}\n`;for(let r of rows)str+=`${state.checked[r.key]?'[x]':'[ ]'} ${r.name}: ${r.extra?'1 Stk.':`${r.packs} × ${formatAmount(r.pack,r.unit)}`} – ${money(r.cost)}\n`;str+='\n'}return str+'Preise sind Richtwerte; aktuelle Preise und Filialsortiment prüfen.'}
function toast(message){let t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3000)}
async function copyList(){let text=textList();try{await navigator.clipboard.writeText(text);toast('Einkaufsliste kopiert ✓')}catch{let el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();try{document.execCommand('copy');toast('Einkaufsliste kopiert ✓')}catch{toast('Kopieren hier leider nicht möglich')}el.remove()}}
function recipeDialog(day,type){let r=recipeById[state.plan[day][type]];const sum=r.ingredients.map(([id,q])=>`<li><strong>${esc(products[id].name)}</strong><span>${formatAmount(q*state.config.people/3,products[id].unit)}</span></li>`).join('');modalRoot.innerHTML=`<div class="modal-backdrop" data-action="close-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><button class="close-btn" aria-label="Schliessen" data-action="close">×</button><div class="food-illustration">${r.emoji}</div><div class="kicker">${esc(days[day])} · ${typeLabels[type]}</div><h2 id="modal-title">${esc(r.name)}</h2><p>⏱ ${r.min} Minuten · Für ${state.config.people} ${state.config.people===1?'Person':'Personen'}</p></div><div class="modal-body"><div class="pill-list">${r.tags.map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div><h3>Zutaten</h3><ul class="ingredient-list">${sum}</ul><h3>Zubereitung</h3><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="modal-actions"><button class="btn primary" data-action="swap" data-day="${day}" data-type="${type}">⇄ Gericht austauschen</button><button class="btn" data-action="close">Fertig</button></div></div></div></div>`}
function swapDialog(day,type){let current=state.plan[day][type];let rCurrent=recipeById[current];const candidates=R.filter(r=>r.type===type&&available(r)&&r.id!==current);let prev=basket(state.plan).total;let options=candidates.map(r=>{let copy=state.plan.map(x=>({...x}));copy[day][type]=r.id;return {r,total:basket(copy).total}}).sort((a,b)=>a.total-b.total).slice(0,11);
modalRoot.innerHTML=`<div class="modal-backdrop" data-action="close-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><button class="close-btn" aria-label="Schliessen" data-action="close">×</button><div class="kicker">${days[day]} · ${typeLabels[type]}</div><h2 id="modal-title">Gericht austauschen</h2><p>Aktuell: ${esc(rCurrent.name)} · Geschätzter Einkauf: ${money(prev)}</p></div><div class="modal-body"><p class="smallprint">Der Betrag zeigt, was der gesamte Wocheneinkauf nach dem Austausch ungefähr kostet.</p>${options.map(({r,total})=>`<div class="swap-row"><span class="food-pict">${r.emoji}</span><span class="swap-text"><strong>${esc(r.name)}</strong><small>${r.min} Min. · ${money(total)} gesamt ${total<=state.config.budget?'✓ im Budget':'⚠ über Budget'}</small></span><button class="btn small ${total<=state.config.budget?'primary':''}" data-action="choose" data-day="${day}" data-type="${type}" data-id="${r.id}">Wählen</button></div>`).join('')}<div class="modal-actions"><button class="btn" data-action="recipe" data-day="${day}" data-type="${type}">‹ Zurück</button></div></div></div></div>`}
function closeModal(){modalRoot.innerHTML=''}
function switchView(view){state.view=view;state.filter='Alle';closeModal();render();window.scrollTo({top:0,behavior:'smooth'});}
function exportData(){const data=JSON.stringify({version:1,exportedAt:new Date().toISOString(),...state,view:undefined,filter:undefined},null,2);const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));link.download='family-food-planner-daten.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);toast('Daten exportiert')}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action], [data-view]');if(!el)return;if(el.dataset.view){switchView(el.dataset.view);return}const a=el.dataset.action;
 if(a==='close-backdrop'){if(e.target===el)closeModal();return}if(a==='close'){closeModal();return}
 if(a==='regenerate'){generate();render();toast('Neuer Menüplan erstellt ✓')}
 if(a==='recipe')recipeDialog(Number(el.dataset.day),el.dataset.type);
 if(a==='swap')swapDialog(Number(el.dataset.day),el.dataset.type);
 if(a==='choose'){state.plan[Number(el.dataset.day)][el.dataset.type]=el.dataset.id;save();closeModal();render();toast('Gericht & Einkaufsliste aktualisiert ✓')}
 if(a==='copy')copyList();if(a==='print')window.print();
 if(a==='filter'){state.filter=el.dataset.filter;render()}
 if(a==='reset-checks'){state.checked={};save();render();toast('Alle Häkchen zurückgesetzt')}
 if(a==='remove-extra'){e.preventDefault();state.extras=state.extras.filter(x=>x.id!==el.dataset.id);delete state.checked[el.dataset.id];save();render();toast('Produkt entfernt')}
 if(a==='export')exportData();if(a==='reset'){if(confirm('Alle Einstellungen, Pläne und Häkchen wirklich zurücksetzen?')){localStorage.removeItem('ffp-migros-v1');location.reload()}}
});
document.addEventListener('change',e=>{if(e.target.dataset.action==='check'){state.checked[e.target.dataset.key]=e.target.checked;save();render()}});
document.addEventListener('submit',e=>{if(e.target.id==='quick-settings-form'){e.preventDefault();const f=new FormData(e.target),budget=Number(f.get('budget')),people=Number(f.get('people'));if(!Number.isFinite(budget)||budget<0.05||budget>1000000||!Number.isInteger(people)||people<1||people>100){toast('Bitte gültiges Budget und Personenzahl eingeben');return;}state.config.budget=budget;state.config.people=people;state.extras=[];generate();render();toast('Neues Budget und Personenzahl übernommen ✓');return;}
if(e.target.id==='extra-form'){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim(),price=Number(f.get('price'));if(!name||!Number.isFinite(price)||price<0)return;state.extras.push({id:'extra-'+Date.now()+'-'+Math.floor(Math.random()*1e6),name,price:+price.toFixed(2)});save();render();toast('Produkt hinzugefügt ✓')}
 if(e.target.id==='settings-form'){e.preventDefault();let f=new FormData(e.target),budget=Number(f.get('budget')),people=Number(f.get('people')),start=String(f.get('start')||'');if(!Number.isFinite(budget)||budget<0.05||budget>1000000||!Number.isInteger(people)||people<1||people>100||!/^\d{4}-\d\d-\d\d$/.test(start)){toast('Bitte gültige Werte eingeben');return}state.config={budget,people,start,noOnion:f.has('noOnion'),noCream:f.has('noCream'),noSalmon:f.has('noSalmon'),highProtein:f.has('highProtein'),pantry:f.has('pantry')};state.extras=[];generate();switchView('plan');toast('Einstellungen gespeichert & neu geplant ✓')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.FamilyFoodPlanner={products,recipes:R,getState:()=>JSON.parse(JSON.stringify(state)),calculate:basket,generate};
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();

</script>
</body>
</html>
